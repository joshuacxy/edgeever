name: tmp-verify-edgeever

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployed EdgeEver
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health check
        run: |
          set -e
          echo "=== /api/health ==="
          curl -fsS -w "\nHTTP=%{http_code}\n" --max-time 30 https://edgeever.joshuacxy.workers.dev/api/health
          echo
          echo "=== /api/openapi.json status ==="
          curl -fsS -o /dev/null -w "HTTP=%{http_code}\n" --max-time 30 https://edgeever.joshuacxy.workers.dev/api/openapi.json
          echo
          echo "=== root page status ==="
          curl -fsS -o /dev/null -w "HTTP=%{http_code}\n" --max-time 30 https://edgeever.joshuacxy.workers.dev/
          echo "VERIFY_DONE_OK"
