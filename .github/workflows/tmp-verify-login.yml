name: tmp-verify-login

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify admin login
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login verification
        env:
          EE_PASS: ${{ secrets.EDGE_EVER_VERIFY_PASS }}
        run: |
          set -e
          echo "=== login attempt ==="
          RESP=$(curl -fsS -w $'\n%{http_code}' --max-time 30 -X POST https://edgeever.joshuacxy.workers.dev/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"admin\",\"password\":\"${EE_PASS}\"}")
          BODY=$(echo "$RESP" | sed '$d')
          CODE=$(echo "$RESP" | tail -1)
          echo "HTTP=$CODE"
          echo "BODY=$BODY"
          if echo "$BODY" | grep -q '"authenticated":true'; then
            echo "LOGIN_OK authenticated=true"
          else
            echo "LOGIN_FAIL no-authenticated"
            exit 1
          fi
          if echo "$BODY" | grep -q '"sessionToken"'; then
            echo "LOGIN_OK token_present"
          else
            echo "LOGIN_FAIL no-token"
            exit 1
          fi
          echo "VERIFY_LOGIN_DONE"
